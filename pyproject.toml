[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dutchgroceries"
dynamic = ["version"]
description = "Self-hosted supermarket purchase history for Albert Heijn and Jumbo: sync your receipts, see what you spend and how prices change."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.11.8"]

[project.urls]
Homepage = "https://github.com/ldanicel/dutchgroceries"
Issues = "https://github.com/ldanicel/dutchgroceries/issues"

[project.scripts]
groceries = "groceries.cli:main"

[tool.setuptools.dynamic]
version = { attr = "groceries.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groceries = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
